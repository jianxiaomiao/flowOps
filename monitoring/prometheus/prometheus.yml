global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot 的 context-path 为 /flowOps，因此 Actuator 的完整路径也包含此前缀。
  - job_name: flowops-backend
    metrics_path: /flowOps/actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  # 使用 RabbitMQ 详细指标端点，只抓 FlowOps 的两个队列，避免抓取无关的逐对象指标。
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]
      queue: ["^flowops\\.notification(\\.dlq)?$"]
    static_configs:
      - targets: ["rabbitmq:15692"]
