groups:
  - name: flowops-minimum-alerts
    rules:
      - alert: FlowOpsBackendUnavailable
        expr: up{job="flowops-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "FlowOps 后端不可抓取"
          description: "Prometheus 已连续 2 分钟无法抓取后端指标。"

      - alert: FlowOpsHighHttpErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="flowops-backend",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="flowops-backend"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FlowOps 5xx 错误率过高"
          description: "连续 5 分钟 HTTP 5xx 比例超过 5%。"

      - alert: FlowOpsSlowHttpRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="flowops-backend",uri!~".*/actuator.*"}[5m]))
          ) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FlowOps P95 请求过慢"
          description: "连续 5 分钟 HTTP 请求 P95 延迟超过 1.5 秒。"

      - alert: FlowOpsSlaScanStale
        expr: time() - flowops_sla_scan_last_success_unixtime > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "FlowOps SLA 扫描未按时成功"
          description: "最近一次完整 SLA 扫描成功距今超过 3 分钟。"

      - alert: FlowOpsSlaScanFailure
        expr: increase(flowops_sla_scan_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "FlowOps SLA 扫描出现错误"
          description: "最近 5 分钟内 SLA 扫描或单工单处理出现异常。"

      - alert: FlowOpsRabbitMqBacklog
        expr: rabbitmq_detailed_queue_messages{job="rabbitmq-queues",queue="flowops.notification"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FlowOps 通知队列积压"
          description: "通知队列连续 5 分钟超过 100 条消息。"

      - alert: FlowOpsRabbitMqDeadLetterNotEmpty
        expr: rabbitmq_detailed_queue_messages{job="rabbitmq-queues",queue="flowops.notification.dlq"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "FlowOps 通知死信队列存在消息"
          description: "通知死信队列非空，需要排查消费失败原因。"
