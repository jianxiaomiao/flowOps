name: FlowOps quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowops-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: flowops_ci
          MYSQL_ROOT_PASSWORD: flowops-root-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pflowops-root-ci-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      rabbitmq:
        image: rabbitmq:4.3.2-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      SPRING_PROFILES_ACTIVE: test
      FLOWOPS_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/flowops_ci?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      FLOWOPS_TEST_DB_USERNAME: root
      FLOWOPS_TEST_DB_PASSWORD: flowops-root-ci-password
      FLOWOPS_TEST_RABBITMQ_HOST: 127.0.0.1
      FLOWOPS_TEST_RABBITMQ_PORT: "5672"
      FLOWOPS_TEST_RABBITMQ_USERNAME: guest
      FLOWOPS_TEST_RABBITMQ_PASSWORD: guest
      FLOWOPS_TEST_RABBITMQ_VHOST: /
      FLOWOPS_TEST_JWT_SECRET: flowops-ci-test-jwt-secret-must-be-at-least-32-bytes
      FLOWOPS_RUN_REDIS_IT: "true"
      FLOWOPS_RUN_FLYWAY_IT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit and integration tests
        working-directory: demo
        run: mvn -B test

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: Type-check and build
        working-directory: web
        run: npm run build

  playwright:
    name: Browser E2E against Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      FLOWOPS_DB_PASSWORD: flowops-ci-db-password
      FLOWOPS_DB_ROOT_PASSWORD: flowops-ci-root-password
      FLOWOPS_REDIS_PASSWORD: flowops-ci-redis-password
      FLOWOPS_RABBITMQ_PASSWORD: flowops-ci-rabbitmq-password
      FLOWOPS_JWT_SECRET: flowops-ci-jwt-secret-must-be-at-least-32-bytes
      FLOWOPS_GRAFANA_ADMIN_PASSWORD: grafana-ci-local-only-password
      FLOWOPS_REGISTRATION_ENABLED: "true"
      FLOWOPS_E2E_TENANT_CODE: E2ECI
      FLOWOPS_E2E_USERNAME: e2e_admin
      FLOWOPS_E2E_PASSWORD: E2e-Ci-Only-123456
      FLOWOPS_E2E_BASE_URL: http://127.0.0.1:5173
      FLOWOPS_E2E_API_BASE_URL: http://127.0.0.1:8080/flowOps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and start the application stack
        run: docker compose --parallel 1 up --build -d
      - name: Wait for backend startup
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/flowOps/auth/me || true)"
            if [ "$status" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1
      - name: Create an isolated E2E tenant and administrator
        shell: bash
        run: |
          curl --fail-with-body --request POST http://127.0.0.1:8080/flowOps/auth/register \
            --header 'Content-Type: application/json' \
            --data '{"tenantCode":"E2ECI","tenantName":"FlowOps CI E2E","adminUsername":"e2e_admin","adminPassword":"E2e-Ci-Only-123456","adminDisplayName":"CI E2E Admin","adminEmail":"e2e@example.invalid","adminPhone":"10000000000"}'
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop isolated application stack
        if: always()
        run: docker compose down -v
