name: flowops

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${FLOWOPS_DB_NAME:-flowops}
      MYSQL_USER: ${FLOWOPS_DB_USERNAME:-flowops}
      MYSQL_PASSWORD: ${FLOWOPS_DB_PASSWORD:?Copy .env.example to .env and set FLOWOPS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${FLOWOPS_DB_ROOT_PASSWORD:?Copy .env.example to .env and set FLOWOPS_DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${FLOWOPS_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${FLOWOPS_REDIS_PASSWORD:?Copy .env.example to .env and set FLOWOPS_REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${FLOWOPS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${FLOWOPS_REDIS_PASSWORD:?Copy .env.example to .env and set FLOWOPS_REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${FLOWOPS_RABBITMQ_USER:-flowops}
      RABBITMQ_DEFAULT_PASS: ${FLOWOPS_RABBITMQ_PASSWORD:?Copy .env.example to .env and set FLOWOPS_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${FLOWOPS_RABBITMQ_VHOST:-flowops}
    ports:
      - "127.0.0.1:${FLOWOPS_RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${FLOWOPS_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${FLOWOPS_DB_NAME:-flowops}?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${FLOWOPS_DB_USERNAME:-flowops}
      SPRING_DATASOURCE_PASSWORD: ${FLOWOPS_DB_PASSWORD:?Copy .env.example to .env and set FLOWOPS_DB_PASSWORD}
      FLOWOPS_JWT_SECRET: ${FLOWOPS_JWT_SECRET:?Copy .env.example to .env and set FLOWOPS_JWT_SECRET}
      FLOWOPS_REDIS_ENABLED: "true"
      FLOWOPS_REDIS_HOST: redis
      FLOWOPS_REDIS_PORT: "6379"
      FLOWOPS_REDIS_PASSWORD: ${FLOWOPS_REDIS_PASSWORD:?Copy .env.example to .env and set FLOWOPS_REDIS_PASSWORD}
      FLOWOPS_MESSAGING_ENABLED: "true"
      FLOWOPS_RABBITMQ_HOST: rabbitmq
      FLOWOPS_RABBITMQ_AMQP_PORT: "5672"
      FLOWOPS_RABBITMQ_USER: ${FLOWOPS_RABBITMQ_USER:-flowops}
      FLOWOPS_RABBITMQ_PASSWORD: ${FLOWOPS_RABBITMQ_PASSWORD:?Copy .env.example to .env and set FLOWOPS_RABBITMQ_PASSWORD}
      FLOWOPS_RABBITMQ_VHOST: ${FLOWOPS_RABBITMQ_VHOST:-flowops}
      FLOWOPS_LOG_PATH: /app/logs
      FLOWOPS_REGISTRATION_ENABLED: ${FLOWOPS_REGISTRATION_ENABLED:-false}
    ports:
      - "127.0.0.1:${FLOWOPS_BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FLOWOPS_WEB_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
