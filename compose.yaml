name: flowops

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${FLOWOPS_DB_NAME:-flowops}
      MYSQL_USER: ${FLOWOPS_DB_USERNAME:-flowops}
      MYSQL_PASSWORD: ${FLOWOPS_DB_PASSWORD:?Copy .env.example to .env and set FLOWOPS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${FLOWOPS_DB_ROOT_PASSWORD:?Copy .env.example to .env and set FLOWOPS_DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${FLOWOPS_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${FLOWOPS_REDIS_PASSWORD:?Copy .env.example to .env and set FLOWOPS_REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${FLOWOPS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${FLOWOPS_REDIS_PASSWORD:?Copy .env.example to .env and set FLOWOPS_REDIS_PASSWORD}

  rabbitmq:
    build:
      context: ./monitoring/rabbitmq
      dockerfile: Dockerfile
    image: flowops-rabbitmq:4.3.2-management-prometheus
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${FLOWOPS_RABBITMQ_USER:-flowops}
      RABBITMQ_DEFAULT_PASS: ${FLOWOPS_RABBITMQ_PASSWORD:?Copy .env.example to .env and set FLOWOPS_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${FLOWOPS_RABBITMQ_VHOST:-flowops}
    ports:
      - "127.0.0.1:${FLOWOPS_RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${FLOWOPS_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${FLOWOPS_DB_NAME:-flowops}?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${FLOWOPS_DB_USERNAME:-flowops}
      SPRING_DATASOURCE_PASSWORD: ${FLOWOPS_DB_PASSWORD:?Copy .env.example to .env and set FLOWOPS_DB_PASSWORD}
      FLOWOPS_JWT_SECRET: ${FLOWOPS_JWT_SECRET:?Copy .env.example to .env and set FLOWOPS_JWT_SECRET}
      FLOWOPS_REDIS_ENABLED: "true"
      FLOWOPS_REDIS_HOST: redis
      FLOWOPS_REDIS_PORT: "6379"
      FLOWOPS_REDIS_PASSWORD: ${FLOWOPS_REDIS_PASSWORD:?Copy .env.example to .env and set FLOWOPS_REDIS_PASSWORD}
      FLOWOPS_MESSAGING_ENABLED: "true"
      FLOWOPS_RABBITMQ_HOST: rabbitmq
      FLOWOPS_RABBITMQ_AMQP_PORT: "5672"
      FLOWOPS_RABBITMQ_USER: ${FLOWOPS_RABBITMQ_USER:-flowops}
      FLOWOPS_RABBITMQ_PASSWORD: ${FLOWOPS_RABBITMQ_PASSWORD:?Copy .env.example to .env and set FLOWOPS_RABBITMQ_PASSWORD}
      FLOWOPS_RABBITMQ_VHOST: ${FLOWOPS_RABBITMQ_VHOST:-flowops}
      FLOWOPS_MILVUS_HOST: milvus
      FLOWOPS_MILVUS_PORT: "19530"
      FLOWOPS_OLLAMA_URL: ${FLOWOPS_OLLAMA_URL:-http://host.docker.internal:11434}
      FLOWOPS_OLLAMA_EMBEDDING_MODEL: ${FLOWOPS_OLLAMA_EMBEDDING_MODEL:-qwen3-embedding-4b}
      FLOWOPS_LOG_PATH: /app/logs
      FLOWOPS_REGISTRATION_ENABLED: ${FLOWOPS_REGISTRATION_ENABLED:-false}
      FLOWOPS_REGISTRATION_EMAIL_VERIFICATION_ENABLED: ${FLOWOPS_REGISTRATION_EMAIL_VERIFICATION_ENABLED:-true}
      FLOWOPS_MAIL_HOST: ${FLOWOPS_MAIL_HOST:-smtp.qq.com}
      FLOWOPS_MAIL_PORT: ${FLOWOPS_MAIL_PORT:-465}
      FLOWOPS_MAIL_USERNAME: ${FLOWOPS_MAIL_USERNAME:-}
      FLOWOPS_MAIL_PASSWORD: ${FLOWOPS_MAIL_PASSWORD:-}
    ports:
      - "127.0.0.1:${FLOWOPS_BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      milvus:
        condition: service_healthy

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FLOWOPS_WEB_PORT:-5173}:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${FLOWOPS_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
      - rabbitmq

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${FLOWOPS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${FLOWOPS_MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.5
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:${FLOWOPS_MILVUS_PORT:-19530}:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${FLOWOPS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${FLOWOPS_GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env and set FLOWOPS_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${FLOWOPS_GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
