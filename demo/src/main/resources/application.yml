spring:
  profiles:
    default: local
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  servlet:
    context-path: /flowOps
  port: 8080

# 默认从 demo 目录启动时写入 flowops/logger；可用环境变量 FLOWOPS_LOG_PATH 覆盖。
flowops:
  logging:
    path: ${FLOWOPS_LOG_PATH:../logger}
  security:
    jwt:
      issuer: flowops
      access-token-ttl: 30m
      secret: ${FLOWOPS_JWT_SECRET:}
  registration:
    enabled: ${FLOWOPS_REGISTRATION_ENABLED:true}
  messaging:
    enabled: ${FLOWOPS_MESSAGING_ENABLED:false}
    publish-batch-size: 100
  sla:
    enabled: ${FLOWOPS_SLA_ENABLED:true}
    scan-delay: 60s
