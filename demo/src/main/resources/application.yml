spring:
  profiles:
    default: local
  data:
    redis:
      host: ${FLOWOPS_REDIS_HOST:localhost}
      port: ${FLOWOPS_REDIS_PORT:6379}
      password: ${FLOWOPS_REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  servlet:
    context-path: /flowOps
  port: 8080

# 只通过 HTTP 暴露健康、应用信息和 Prometheus 抓取端点；敏感配置与 heapdump 等端点保持关闭。
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: flowops
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s

# 默认从 demo 目录启动时写入 flowops/logger；可用环境变量 FLOWOPS_LOG_PATH 覆盖。
flowops:
  redis:
    enabled: ${FLOWOPS_REDIS_ENABLED:false}
    key-prefix: flowops
    default-ttl: 10m
    notification-unread-ttl: 30s
    login-max-failures: 5
    login-window: 5m
    registration-max-requests: 3
    registration-window: 1h
  logging:
    path: ${FLOWOPS_LOG_PATH:../logger}
  security:
    jwt:
      issuer: flowops
      access-token-ttl: 30m
      secret: ${FLOWOPS_JWT_SECRET:}
  registration:
    enabled: ${FLOWOPS_REGISTRATION_ENABLED:true}
  messaging:
    enabled: ${FLOWOPS_MESSAGING_ENABLED:false}
    publish-batch-size: 100
  sla:
    enabled: ${FLOWOPS_SLA_ENABLED:true}
    scan-delay: 60s
