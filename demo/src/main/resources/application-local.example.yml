# Copy this file to application-local.yml and replace the placeholder values.
# application-local.yml is intentionally excluded from Git.
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flowops_dev?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: your_database_username
    password: your_database_password

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

flowops:
  security:
    jwt:
      # 至少 32 字节；生产环境请使用密码管理服务注入，绝不能提交真实密钥。
      secret: replace-with-a-random-secret-at-least-32-bytes
  messaging:
    enabled: false
