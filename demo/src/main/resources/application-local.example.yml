# Copy this file to application-local.yml and replace the placeholder values.
# application-local.yml is intentionally excluded from Git.
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flowops_dev?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: your_database_username
    password: your_database_password
  rabbitmq:
    host: ${FLOWOPS_RABBITMQ_HOST:localhost}
    port: ${FLOWOPS_RABBITMQ_AMQP_PORT:5672}
    username: ${FLOWOPS_RABBITMQ_USER:flowops}
    password: ${FLOWOPS_RABBITMQ_PASSWORD:}
    virtual-host: ${FLOWOPS_RABBITMQ_VHOST:flowops}
    connection-timeout: 5s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

flowops:
  registration:
    enabled: ${FLOWOPS_REGISTRATION_ENABLED:true}
  security:
    jwt:
      # 至少 32 字节；生产环境请使用密码管理服务注入，绝不能提交真实密钥。
      secret: replace-with-a-random-secret-at-least-32-bytes
  messaging:
    enabled: ${FLOWOPS_MESSAGING_ENABLED:false}
