spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${FLOWOPS_DB_URL}
    username: ${FLOWOPS_DB_USERNAME}
    password: ${FLOWOPS_DB_PASSWORD}

  rabbitmq:
    host: ${FLOWOPS_RABBITMQ_HOST}
    port: ${FLOWOPS_RABBITMQ_AMQP_PORT:5672}
    username: ${FLOWOPS_RABBITMQ_USER}
    password: ${FLOWOPS_RABBITMQ_PASSWORD}
    virtual-host: ${FLOWOPS_RABBITMQ_VHOST:flowops}

flowops:
  security:
    jwt:
      secret: ${FLOWOPS_JWT_SECRET}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
